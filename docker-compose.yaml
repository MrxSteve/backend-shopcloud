version: '3.9'

services:

  postgres:
    image: postgres:15
    container_name: shopcloud-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"  
    volumes:
      - vol_postgres_shopcloud:/var/lib/postgresql/data
      - ./init-db/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    networks:
      - shopcloud-net

  mongodb:
    image: mongo:6
    container_name: shopcloud-mongo
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MONGO_PORT}:27017"  
    volumes:
      - vol_mongo_shopcloud:/data/db
    networks:
      - shopcloud-net

  redis:
    image: redis:7.2
    container_name: shopcloud-redis
    restart: unless-stopped
    env_file: .env
    ports:
      - "${REDIS_PORT}:6379"  
    volumes:
      - vol_redis_shopcloud:/data
    networks:
      - shopcloud-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shopcloud-rabbitmq
    restart: unless-stopped
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    networks:
      - shopcloud-net

networks:
  shopcloud-net:
    driver: bridge

volumes:
  vol_postgres_shopcloud:
  vol_mongo_shopcloud:
  vol_redis_shopcloud: